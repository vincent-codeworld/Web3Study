syntax = "proto3";

package dto;

option go_package = "internal/dto;dto";
import "internal/pb/order.proto";

enum Operate {
  OpUnKnown = 0;
  OpAdd = 1;
  OpDel = 2;
  OpMod = 3;
}

enum Priority{
  UnKnown = 0;
  High = 1;
  Medium = 2;
  Low = 3;
}

message OrderEvent{
  Operate op = 1;
  string price = 2;
  int64 order_id = 3;
  string user_id = 4;
  string amt = 5;
  OrderState order_state = 6;
  Side side = 7;
  Priority priority = 8; // 冰山订单会使用到，在特定情况下，会影响订单在队列里的信息
}